[package]
name = "lazy_town_exporter"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "the package builder, built to WebAssembly for the FrayTools publish plugin"

[lib]
crate-type = ["cdylib"]

[dependencies]
# the package builder is Peptide's (crates/fra-pack), the same code `peptide pack` runs
fra_pack = { git = "https://github.com/otsono/Peptide", branch = "main" }
anyhow = "1.0"
serde_json = "1.0"
rayon = "1.10"
wasm-bindgen = "=0.2.129"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
